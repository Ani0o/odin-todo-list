<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <img src="./icons/todo.svg">
        <h1>TODO LIST</h1>
    </div>

    <div class="side-nav">
        <div class="side-nav-header">
            <h2>Projects</h2>
            <button class="new-project-button"><img src="./icons/plus.svg">New Project</button>
        </div>

        <div class="side-nav-project-list">
            <p class="project">My project</p>
            <p class="project">Epik game</p>
            <p class="project">Crazy site</p>
            <p class="project">Portfolio</p>
            <p class="project">DSA</p>
            <p class="project">Full stack</p>
        </div>
    </div>

    <div class="todo-section">
        <div class="todo-section-header">
            <h3 class="selected-project"># MyProject</h3>
            <div class="todo-section-header-buttons">
                <button class="new-todo-button"><img src="./icons/plus.svg">New Todo</button>
                <button class="delete-project-button"><img src="./icons/delete.svg">Delete Project</button>
            </div>
        </div>

        <div class="todo-section-content">
            <div class="todo">
                <div class="todo-header">
                    <p class="todo-title">Todo 1</p>
                    <div class="todo-header-right-wrapper">
                        <p class="todo-priority">High Priority</p>
                        <p class="todo-duedate">Due Tomorrow</p>
                        <img>
                    </div>
                </div>

                <div class="todo-content-wrapper">
                    <div class="todo-content">
                        <p class="todo-description">Yo what's up dude</p>
                        <div class="todo-content-right-wrapper">
                            <button class="edit-priority-button"><img src="./icons/edit.svg">Edit Priority</button>
                            <button class="edit-duedate-button"><img src="./icons/edit.svg">Edit Due Date</button>
                            <button class="delete-todo-button"><img src="./icons/delete.svg">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="todo">

                <div class="todo-content-wrapper">

                        <div class="todo-content-right-wrapper">
                            <button class="edit-priority-button"><img src="./icons/edit.svg">Edit Priority</button>
                            <button class="edit-duedate-button"><img src="./icons/edit.svg">Edit Due Date</button>
                            <button class="delete-todo-button"><img src="./icons/delete.svg">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="todo">
                <div class="todo-header">
                    <p class="todo-title">Todo 1</p>

                        <p class="todo-priority">High Priority</p>

                    </div>
                </div>

                <div class="todo-content-wrapper">
                    <div class="todo-content">
                        <p class="todo-description">Yo what's up dude</p>
                        <div class="todo-content-right-wrapper">
                            <button class="edit-priority-button"><img src="./icons/edit.svg">Edit Priority</button>
                            <button class="edit-duedate-button"><img src="./icons/edit.svg">Edit Due Date</button>
                            <button class="delete-todo-button"><img src="./icons/delete.svg">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
