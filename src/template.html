<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <img src="./icons/todo.svg">
        <h1>TODO LIST</h1>
    </div>

    <div class="side-nav">
        <div class="side-nav-header">
            <h2>Projects</h2>
            <button class="new-project-button"><img src="./icons/plus.svg">New Project</button>
            <dialog class="project-dialog">
                <form method="dialog">
                        <div>
                            <label for="project-form-title">Title:</label>
                            <input id="project-form-title" type="text" name="title" required>
                        </div>
                        <div>
                            <button class="project-form-cancel-button" type="button" value="cancel" formnovalidate>Cancel</button>
                            <button class="project-form-submit-button" type="submit" value="submit">Add</button>
                        </div>
                </form>
            </dialog>
        </div>

        <div class="side-nav-project-list"></div>
    </div>

    <div class="todo-section">
        <div class="todo-section-header">
            <h3 class="selected-project"># MyProject</h3>
            <div class="todo-section-header-buttons">
                <button class="new-todo-button"><img src="./icons/plus.svg">New Todo</button>
                <button class="delete-project-button"><img src="./icons/delete.svg">Delete Project</button>

                <dialog class="todo-dialog">
                    <form method="dialog">
                        <div>
                            <div>
                                <label for="todo-form-title">Title:</label>
                                <input id="todo-form-title" type="text" name="title" required>
                            </div>

                            <div>
                                <label for="todo-form-description">Description:</label>
                                <input id="todo-form-description" type="text" name="description" required>
                            </div>

                            <div>
                                <label for="todo-form-priority">Priority:</label>
                                <select id="todo-form-priority" name="priority">
                                    <option value="1">Low</option>
                                    <option value="2" selected>Medium</option>
                                    <option value="3">High</option>
                                </select>
                            </div>

                            <div>
                                <label for="todo-form-duedate">Due Date:</label>
                                <input id="todo-form-duedate" type="date" name="duedate" required>
                            </div>
                        </div>

                        <div>
                            <button class="todo-form-cancel-button" type="button" value="cancel" formnovalidate>Cancel</button>
                            <button class="todo-form-submit-button" type="submit" value="submit">Add</button>
                        </div>
                    </form>
                </dialog>
            </div>
        </div>

        <div class="todo-section-content"></div>
    </div>
</body>
</html>
