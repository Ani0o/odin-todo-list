<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div class="header">
        <img>
        <h1>TODO LIST</h1>
    </div>

    <div class="side-nav">
        <div class="side-nav-header">
            <h2>Projects</h2>
            <button class="new-project"><img>New Project</button>
        </div>

        <div class="side-nav-project-list">
            <p class="project">My project</p>
            <p class="project">Epik game</p>
            <p class="project">Crazy site</p>
            <p class="project">Portfolio</p>
            <p class="project">DSA</p>
            <p class="project">Full stack</p>
        </div>
    </div>

    <div class="todo-section">
        <div class="todo-section-header">
            <h3 class="selected-project"># MyProject</h3>
            <div todo-section-header-buttons>
                <button class="new-todo"><img>New Todo</button>
                <button class="delete-project"><img>Delete Project</button>
            </div>
        </div>

        <div class="todo-section-content">
            <div class="todo">
                
            </div>
        </div>
    </div>
</body>
</html>
