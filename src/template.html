<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <div class="header">
        <img>
        <h1>TODO LIST</h1>
    </div>

    <div class="side-nav">
        <div class="side-nav-header">
            <h2>Projects</h2>
            <button class="new-project"><img>New Project</button>
        </div>

        <div class="side-nav-project-list">
            <p class="project">My project</p>
            <p class="project">Epik game</p>
            <p class="project">Crazy site</p>
            <p class="project">Portfolio</p>
            <p class="project">DSA</p>
            <p class="project">Full stack</p>
        </div>
    </div>

    <div class="todo-section">

            <h3 class="selected-project"># MyProject</h3>
            <div todo-section-header-buttons>
                <button class="new-todo"><img>New Todo</button>
                <button class="delete-project"><img>Delete Project</button>
            </div>
        </div>

        <div class="todo-section-content">
            <div class="todo">
                <div class="todo-header">
                    <p class="todo-title">Todo 1</p>
                    <div class="todo-header-right-wrapper">
                        <p class="todo-priority">High Priority</p>
                        <p class="todo-duedate">Due Tomorrow</p>
                        <img>
                    </div>
                </div>

                <div class="todo-content-wrapper">
                    <div class="todo-content">
                        <p class="todo-description">Yo what's up dude</p>
                        <div class="todo-content-right-wrapper">
                            <button class="edit-priority">Edit Priority</button>
                            <button class="edit-duedate">Edit Due Date</button>
                            <button class="delete-todo">Delete</button>

                    </div>
                </div>
            </div>
